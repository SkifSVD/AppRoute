name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Один локальный runner — не запускаем сборки параллельно, старую отменяем
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    # Локальный self-hosted runner (см. docs: README, раздел «CI»)
    runs-on: [self-hosted, Windows, X64, approute]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # build.ps1 сам найдёт cmake из установленной Visual Studio
      - name: Build and test
        run: ./build.ps1 -Config Release -Test

      - uses: actions/upload-artifact@v4
        with:
          name: approute-x64
          path: |
            build/bin/Release/*.exe
            build/bin/Release/*.dll
