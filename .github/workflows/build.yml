name: build

on:
  push:
    branches: [main]
    tags: ['v*']          # тег выпуска vX.Y.Z (#63) — его ставит build.ps1 -Publish
  pull_request:
  workflow_dispatch:

# Один локальный runner — не запускаем сборки параллельно, старую отменяем
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    # Локальный self-hosted runner (см. docs: README, раздел «CI»)
    runs-on: [self-hosted, Windows, X64, approute]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0      # версия считается по тегам выпусков (#63) — нужна вся история

      # Версия — по тегам выпусков git, тем же правилом, что при сборке (cmake/GitVersion.cmake)
      - name: Version
        id: version
        run: |
          $lists = Get-Content CMakeLists.txt -Raw
          if ($lists -notmatch 'project\(AppRoute\s+VERSION\s+(\d+\.\d+\.\d+)') { throw 'Не найдена версия в CMakeLists.txt' }
          $cmake = (Get-Command cmake -ErrorAction SilentlyContinue)?.Source
          if (-not $cmake) {
              $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -products * -property installationPath
              $cmake = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
          }
          $version = (& $cmake "-DSOURCE_DIR=$PWD" "-DBASE_VERSION=$($Matches[1])" -P cmake/GitVersion.cmake | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE) { throw 'Не удалось вычислить версию' }
          Write-Host "AppRoute $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      # build.ps1 сам найдёт cmake из установленной Visual Studio. Поставка и установщик (#64) —
      # без тега: тег выпуска ставит владелец (build.ps1 -Publish у себя)
      - name: Build and test
        run: ./build.ps1 -Config Release -Test -Publish -Installer -NoTag

      - uses: actions/upload-artifact@v4
        with:
          name: approute-${{ steps.version.outputs.version }}-x64
          path: |
            build/bin/Release/*.exe
            build/bin/Release/*.dll

      - uses: actions/upload-artifact@v4
        with:
          name: approute-${{ steps.version.outputs.version }}-setup
          path: deploy/AppRoute-${{ steps.version.outputs.version }}-setup.exe

      # Драйвер и пакет для подписи Microsoft (#51, docs/driver-signing.md) — если на runner'е есть WDK.
      # Пакет не подписан: CAB подписывает EV-сертификатом владелец аккаунта Partner Center.
      - name: Driver package
        id: driver
        run: |
          $inc = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          $wdk = Get-ChildItem $inc -Directory -ErrorAction SilentlyContinue |
              Where-Object { Test-Path "$($_.FullName)\km\fwpsk.h" }
          if (-not $wdk) { Write-Host 'WDK не найден — драйвер не собирается'; exit 0 }
          ./tools/driver/Build-Driver.ps1 -NoSign -Package
          "built=true" >> $env:GITHUB_OUTPUT
          exit 0

      - uses: actions/upload-artifact@v4
        if: steps.driver.outputs.built == 'true'
        with:
          name: approute-wfp-package
          path: build/driver/approute-wfp.cab
